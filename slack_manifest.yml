# Paste into https://api.slack.com/apps -> Create New App -> From a manifest
display_information:
  name: Contact Finder
  description: Finds emails, phone numbers and LinkedIn profiles via Apollo
features:
  bot_user:
    display_name: Contact Finder
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /findcontact
      description: Find contact details for a person or role
      usage_hint: "Jane Doe at acme.com | CFO at acme.com | linkedin.com/in/janedoe"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
